name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Build Debug APK (TV)
        run: |
          cd app/native
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleTvDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyOnTV-APK-TV
          path: 'app/native/**/build/outputs/apk/tv/debug/*.apk'
